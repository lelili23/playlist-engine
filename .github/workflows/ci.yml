# Runs every test on each pull request and on every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # if one build fails, still report the others
      matrix:
        include:
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: asan + ubsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DPLGEN_SANITIZE=ON
          - name: tsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DPLGEN_TSAN=ON
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev
      - name: Let ThreadSanitizer run
        if: matrix.name == 'tsan'
        # TSan can't map its shadow memory under the runner's default address randomization.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  go:
    name: Go gateway
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test (race detector on)
        run: go test -race ./...
