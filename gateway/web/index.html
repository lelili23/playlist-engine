<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* The page takes its color from the vibe: --h1/--h2 are hues, --s saturation.
     Registered with @property so the browser can animate between vibes. */
  @property --h1 { syntax: "<number>"; inherits: true; initial-value: 262; }
  @property --h2 { syntax: "<number>"; inherits: true; initial-value: 312; }
  @property --s  { syntax: "<number>"; inherits: true; initial-value: 55; }

  :root {
    --ink: #f6f4fb;
    --soft: rgba(246, 244, 251, .62);
    --faint: rgba(246, 244, 251, .38);
    --glass: rgba(255, 255, 255, .07);
    --glass-2: rgba(255, 255, 255, .12);
    --edge: rgba(255, 255, 255, .12);
    --font: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: 400 17px/1.5 var(--font);
    background-color: hsl(var(--h1) 32% 7%);
    background-image:
      radial-gradient(70% 55% at 8% -5%, hsl(var(--h1) calc(var(--s) * 1%) 34% / .75), transparent 70%),
      radial-gradient(55% 45% at 100% 0%, hsl(var(--h2) calc(var(--s) * 1%) 38% / .45), transparent 70%);
    background-attachment: fixed;
    transition: --h1 1.2s ease, --h2 1.2s ease, --s 1.2s ease;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }
  main { max-width: 920px; margin: 0 auto; padding: 28px 28px 120px; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { display: block; }

  .wordmark { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; color: var(--soft); margin: 0 0 15vh; }

  /* ---- Hero ---- */
  h1 {
    font-size: clamp(52px, 9.5vw, 108px); line-height: .92; letter-spacing: -0.045em;
    font-weight: 700;
    margin: 0 0 40px;
  }
  .field {
    display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 26px;
    background: var(--glass); border: 1px solid var(--edge); border-radius: 22px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .field:focus-within { background: var(--glass-2); }
  #idea { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink);
          font: 500 22px/1.3 var(--font); letter-spacing: -0.01em; padding: 14px 0; }
  #idea::placeholder { color: var(--faint); }
  #go { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--ink);
        color: hsl(var(--h1) 40% 12%); display: grid; place-items: center;
        transition: transform .15s ease; }
  #go:hover { transform: scale(1.05); }
  #go:active { transform: scale(.95); }
  #go:disabled { opacity: .5; cursor: progress; }

  .under { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px 28px;
           margin: 18px 4px 0; font-size: 15px; color: var(--faint); }
  .tries { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; }
  .tries button { color: var(--soft); text-decoration: underline; text-decoration-color: transparent;
                  text-underline-offset: 4px; transition: color .15s, text-decoration-color .15s; }
  .tries button:hover { color: var(--ink); text-decoration-color: var(--faint); }
  .opts { display: flex; gap: 22px; align-items: center; }
  .opts select { background: none; border: 0; color: var(--soft); font: inherit; cursor: pointer; padding: 0; }
  .opts select option { background: #1a1820; }
  .opts button { color: var(--soft); }
  .opts button:hover, .opts select:hover { color: var(--ink); }

  #seedpanel { margin: 18px 0 0; }
  #seedq { width: 100%; background: var(--glass); border: 1px solid var(--edge); border-radius: 16px;
           color: var(--ink); font: 400 17px var(--font); padding: 14px 18px; outline: 0; }
  #seedq::placeholder { color: var(--faint); }
  #seedresults { list-style: none; margin: 6px 0 0; padding: 0; }
  #seedresults button { width: 100%; text-align: left; border-radius: 12px; padding: 9px 14px; color: var(--soft); }
  #seedresults button:hover { background: var(--glass); color: var(--ink); }
  #seedresults small { color: var(--faint); font-size: 14px; margin-left: 8px; }
  #seeds { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  #seeds button { display: inline-flex; gap: 8px; align-items: center; background: var(--glass);
                  border-radius: 10px; padding: 7px 10px 7px 14px; font-size: 15px; }
  #seeds button span { color: var(--faint); }
  #seeds button:hover { background: var(--glass-2); }

  #status { min-height: 24px; margin: 22px 4px 0; color: var(--soft); font-size: 15px; }
  #status.error { color: #ffb4a8; }

  /* ---- Playlist ---- */
  #result { margin-top: 72px; scroll-margin-top: 40px; }
  .head { display: grid; grid-template-columns: 232px 1fr; gap: 36px; align-items: end; margin-bottom: 40px; }
  .cover {
    position: relative; width: 232px; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
    display: flex; align-items: flex-end; padding: 18px;
    background:
      radial-gradient(90% 70% at 20% 15%, hsl(var(--h2) calc(var(--s) * 1%) 62% / .9), transparent 60%),
      linear-gradient(150deg, hsl(var(--h1) calc(var(--s) * 1%) 48%), hsl(var(--h2) calc(var(--s) * 1%) 26%));
    box-shadow: 0 24px 60px -20px hsl(var(--h1) 60% 4% / .9);
  }
  .cover p { margin: 0; font-weight: 700; font-size: 28px; line-height: .98; letter-spacing: -0.035em;
             overflow-wrap: anywhere; color: #fff;
             text-shadow: 0 1px 14px rgba(0,0,0,.25); }
  #result-title { font-size: clamp(38px, 6vw, 66px); line-height: .98; letter-spacing: -0.04em;
                  font-weight: 700; margin: 0 0 14px; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; color: var(--soft); font-size: 15px; }
  #copy { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); background: var(--glass-2);
          border-radius: 10px; padding: 9px 14px; font-size: 15px; font-weight: 500; }
  #copy:hover { background: rgba(255,255,255,.18); }
  .hint { color: var(--faint); font-size: 14px; margin: 10px 0 0; }

  ol#tracks { list-style: none; margin: 0; padding: 0; }
  ol#tracks > li { border-radius: 12px; }
  ol#tracks > li:hover, ol#tracks > li.playing { background: rgba(255,255,255,.055); }
  .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center;
         padding: 12px 14px 12px 6px; cursor: pointer; }
  .pos { display: grid; place-items: center; height: 24px; color: var(--faint); font-size: 15px;
         font-variant-numeric: tabular-nums; }
  .pos .eq, .pos .play { display: none; }
  li:hover:not(.playing) .pos .n { display: none; }
  li:hover:not(.playing) .pos .play { display: block; color: var(--ink); }
  li.playing .pos .n { display: none; }
  li.playing .pos .eq { display: flex; }
  .eq { gap: 2px; align-items: flex-end; height: 14px; }
  .eq i { width: 3px; background: var(--ink); border-radius: 1px; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.35s; } .eq i:nth-child(3) { animation-delay: -.7s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }
  @media (prefers-reduced-motion: reduce) { .eq i { animation: none; height: 10px; } }
  .name { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seedmark { font-weight: 400; color: var(--faint); font-size: 14px; margin-left: 10px; }
  .artist { color: var(--soft); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts { display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity .12s; }
  li:hover .acts, li.playing .acts, .acts:focus-within { opacity: 1; }
  .acts button { color: var(--soft); font-size: 14px; padding: 6px 10px; border-radius: 8px; }
  .acts a { color: var(--soft); padding: 7px; border-radius: 8px; }
  .acts button:hover, .acts a:hover { color: var(--ink); background: rgba(255,255,255,.08); }
  .player { padding: 0 14px 14px 56px; }
  .player iframe { width: 100%; height: 80px; border: 0; border-radius: 12px; }

  @media (max-width: 640px) {
    main { padding: 20px 18px 96px; }
    .wordmark { margin-bottom: 9vh; }
    .head { grid-template-columns: 1fr; gap: 24px; }
    .cover { width: min(232px, 70vw); }
    .row { grid-template-columns: 30px minmax(0, 1fr); }
    .acts { opacity: 1; grid-column: 2; margin-left: -10px; }
    .player { padding-left: 14px; }
  }
</style>
</head>
<body>
<main>
  <p class="wordmark">playlist engine</p>

  <h1>What’s the<br>vibe?</h1>

  <form id="form" autocomplete="off">
    <div class="field">
      <label for="idea" class="sr">Describe the vibe</label>
      <input id="idea" maxlength="200" placeholder="rainy day study">
      <button type="submit" id="go" aria-label="Make playlist">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="under">
      <div class="tries" id="examples"><span>Try</span></div>
      <div class="opts">
        <label><span class="sr">Number of songs</span>
          <select id="len"><option value="10">10 songs</option><option value="20" selected>20 songs</option><option value="30">30 songs</option></select>
        </label>
        <button type="button" id="seedtoggle" aria-expanded="false">Build around a song</button>
      </div>
    </div>
    <div id="seedpanel" hidden>
      <label for="seedq" class="sr">Search for a song</label>
      <input id="seedq" placeholder="Search a song or artist">
      <ul id="seedresults"></ul>
    </div>
    <div id="seeds"></div>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <div class="head">
      <div class="cover" aria-hidden="true"><p id="cover-text"></p></div>
      <div>
        <h2 id="result-title"></h2>
        <div class="meta">
          <span id="count"></span>
          <button type="button" id="copy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            <span id="copy-label">Copy for Spotify</span>
          </button>
        </div>
        <p class="hint">Paste into any playlist in the Spotify desktop app.</p>
      </div>
    </div>
    <ol id="tracks"></ol>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const EXAMPLES = ["rainy day study", "gym workout", "late night drive", "sunday morning coffee", "heartbreak"];
const SVG_NS = "http://www.w3.org/2000/svg";
let seeds = [];
let currentTracks = [];

// Builds DOM nodes; strings become text nodes, so song titles can never inject HTML.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  node.append(...children);
  return node;
}

function icon(paths, size = 16) {
  const svg = document.createElementNS(SVG_NS, "svg");
  for (const [k, v] of Object.entries({ width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: "currentColor", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) {
    svg.setAttribute(k, v);
  }
  for (const d of paths) { const p = document.createElementNS(SVG_NS, "path"); p.setAttribute("d", d); svg.append(p); }
  return svg;
}
const PLAY = ["M7 4.5v15l12-7.5z"];
const EXTERNAL = ["M14 4h6v6", "M20 4l-9 9", "M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"];

function setStatus(msg, isError = false) {
  $("status").textContent = msg;
  $("status").className = isError ? "error" : "";
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Something went wrong (${res.status}). Try again.`);
  return body;
}

const artistsOf = (s) => s.artists.split(";").join(", ");

// ---- The vibe sets the color ----
// Mood (valence) picks the hue along a deliberate path that skips greens and
// yellows: sad = blue (225) -> violet -> magenta -> pink -> happy = orange (20).
// Energy pushes the second hue further along and raises saturation.
function setVibe(valence, energy) {
  const h1 = (225 + valence * 155) % 360;
  const h2 = (h1 + 20 + energy * 35) % 360;
  const root = document.body.style;
  root.setProperty("--h1", h1.toFixed(0));
  root.setProperty("--h2", h2.toFixed(0));
  root.setProperty("--s", (38 + energy * 50).toFixed(0));
}
function vibeFromId(id) {  // for "similar songs" views, which have no profile: a stable color per song
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  setVibe((h % 100) / 100, ((h >> 8) % 100) / 100);
}

// ---- Examples, seeds ----
for (const ex of EXAMPLES) {
  $("examples").append(el("button", { type: "button", onclick: () => { $("idea").value = ex; makePlaylist(); } }, ex));
}

$("seedtoggle").addEventListener("click", () => {
  const open = $("seedpanel").hidden;
  $("seedpanel").hidden = !open;
  $("seedtoggle").setAttribute("aria-expanded", String(open));
  if (open) $("seedq").focus();
});

function renderSeeds() {
  $("seeds").replaceChildren(...seeds.map((s) =>
    el("button", { type: "button", "aria-label": `Remove ${s.name}`,
      onclick: () => { seeds = seeds.filter((x) => x.id !== s.id); renderSeeds(); } },
      s.name, el("span", {}, "✕"))));
}

let searchTimer;
$("seedq").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = $("seedq").value.trim();
  if (q.length < 2) { $("seedresults").replaceChildren(); return; }
  searchTimer = setTimeout(async () => {
    try {
      const data = await api(`/search?q=${encodeURIComponent(q)}&limit=6`);
      if (data.results.length === 0) {
        $("seedresults").replaceChildren(el("li", {}, el("button", { type: "button", disabled: "" }, "No songs match. Try part of the title.")));
        return;
      }
      $("seedresults").replaceChildren(...data.results.map((s) => el("li", {},
        el("button", { type: "button", onclick: () => {
          if (seeds.length >= 5) { setStatus("You can build around up to 5 songs.", true); return; }
          if (!seeds.some((x) => x.id === s.id)) seeds.push(s);
          renderSeeds(); $("seedq").value = ""; $("seedresults").replaceChildren();
        } }, s.name, el("small", {}, artistsOf(s))))));
    } catch (e) { setStatus(e.message, true); }
  }, 250);
});

// ---- Playlist ----
function closePlayers() {
  for (const li of document.querySelectorAll("#tracks > li")) {
    li.classList.remove("playing");
    li.querySelector(".player").replaceChildren();
  }
}

function togglePlay(li, t) {
  const wasPlaying = li.classList.contains("playing");
  closePlayers();
  if (wasPlaying) return;
  li.classList.add("playing");
  // Spotify's player plays a preview, or the whole song if you're signed in to Spotify.
  li.querySelector(".player").append(el("iframe", {
    src: `https://open.spotify.com/embed/track/${encodeURIComponent(t.id)}`,
    allow: "autoplay; clipboard-write; encrypted-media", loading: "lazy", title: `Spotify player: ${t.name}` }));
}

function showPlaylist(title, tracks) {
  currentTracks = tracks;
  $("result-title").textContent = title;
  $("cover-text").textContent = title;
  $("count").textContent = `${tracks.length} songs`;
  $("tracks").replaceChildren(...tracks.map((t, i) => {
    const li = el("li");
    const stop = (e) => e.stopPropagation();  // action buttons shouldn't also start the player
    li.append(
      el("div", { class: "row", onclick: () => togglePlay(li, t) },
        el("span", { class: "pos" },
          el("span", { class: "n" }, String(i + 1)),
          el("span", { class: "play" }, icon(PLAY, 14)),
          el("span", { class: "eq", "aria-label": "Playing" }, el("i"), el("i"), el("i"))),
        el("div", { style: "min-width:0" },
          el("div", { class: "name" }, t.name, ...(t.seed ? [el("span", { class: "seedmark" }, "your pick")] : [])),
          el("div", { class: "artist" }, artistsOf(t))),
        el("div", { class: "acts" },
          el("button", { type: "button", onclick: (e) => { stop(e); moreLike(t); } }, "Similar songs"),
          el("a", { href: `https://open.spotify.com/track/${encodeURIComponent(t.id)}`, target: "_blank",
                    rel: "noopener", "aria-label": `Open ${t.name} in Spotify`, title: "Open in Spotify",
                    onclick: stop }, icon(EXTERNAL, 16)))),
      el("div", { class: "player" }));
    return li;
  }));
  $("result").hidden = false;
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function makePlaylist() {
  const idea = $("idea").value.trim();
  if (!idea && seeds.length === 0) { setStatus("Describe a vibe, or build around a song.", true); $("idea").focus(); return; }
  $("go").disabled = true;
  setStatus("Finding songs…");
  try {
    const data = await api("/playlist", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ idea, seeds: seeds.map((s) => s.id), length: Number($("len").value) }),
    });
    if (data.profile) setVibe(data.profile.valence, data.profile.energy);
    else vibeFromId(seeds[0].id);
    setStatus("");
    showPlaylist(idea || `Around ${seeds[0].name}`, data.tracks);
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    $("go").disabled = false;
  }
}

async function moreLike(t) {
  setStatus(`Finding songs like ${t.name}…`);
  try {
    const data = await api(`/similar?song=${encodeURIComponent(t.id)}&k=${$("len").value}`);
    vibeFromId(t.id);
    setStatus("");
    showPlaylist(`Like ${data.query.name}`, [{ ...data.query, seed: true }, ...data.results.map((r) => r.song)]);
  } catch (e) { setStatus(e.message, true); }
}

$("copy").addEventListener("click", async () => {
  const text = currentTracks.map((t) => `https://open.spotify.com/track/${t.id}`).join("\n");
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = el("textarea"); ta.value = text; document.body.append(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  $("copy-label").textContent = "Copied";
  setTimeout(() => { $("copy-label").textContent = "Copy for Spotify"; }, 2000);
});

$("form").addEventListener("submit", (e) => { e.preventDefault(); makePlaylist(); });

api("/health").then((h) => {
  if (h.engine !== "ok") setStatus("The music engine isn’t running. Start plgen_server, then reload.", true);
}).catch(() => setStatus("The music engine isn’t running. Start plgen_server, then reload.", true));
</script>
</body>
</html>
